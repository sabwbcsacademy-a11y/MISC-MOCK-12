  let currentStudent = { name: "", phone: "" };
  let timerInterval = null;

  // Authorization and Login Handler
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const name = document.getElementById('studentName').value.trim();
    const phone = document.getElementById('studentPhone').value.trim();

    if (!ALLOWED_MOBILES.includes(phone)) {
      alert("Access Denied! Your mobile number is not registered for this test.");
      return;
    }

    let attempts = parseInt(localStorage.getItem('attempts_' + phone) || "0");
    if (attempts >= MAX_ATTEMPTS) {
      alert("Attempt limit exceeded! You have reached your maximum limit of 30 attempts.");
      return;
    }

    // Increment Attempt Count
    localStorage.setItem('attempts_' + phone, attempts + 1);
    currentStudent = { name, phone };

    // View Switching
    document.getElementById('displayName').innerText = name;
    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('examSection').classList.remove('hidden');

    renderQuestions();
    startTimer(90 * 60); // 90 Minutes = 5400 Seconds
  });

  // Render Questions UI
  function renderQuestions() {
    const container = document.getElementById('questionsContainer');
    container.innerHTML = questionsData.map((item, idx) => `
      <div class="question-card" id="q_card_${idx}">
        <div class="question-title">${idx + 1}. ${item.q}</div>
        <div class="options-list">
          ${item.options.map((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            return `
              <label class="option-item">
                <input type="radio" name="q_${idx}" value="${letter}">
                ${opt}
              </label>
            `;
          }).join('')}
        </div>
      </div>
    `).join('');
  }

  // Timer Counter
  function startTimer(secondsLeft) {
    const timerDisplay = document.getElementById('timerDisplay');
    
    timerInterval = setInterval(() => {
      let minutes = Math.floor(secondsLeft / 60);
      let seconds = secondsLeft % 60;

      minutes = minutes < 10 ? "0" + minutes : minutes;
      seconds = seconds < 10 ? "0" + seconds : seconds;

      timerDisplay.textContent = `${minutes}:${seconds}`;

      if (--secondsLeft < 0) {
        clearInterval(timerInterval);
        alert("Time is up! Your test is being auto-submitted.");
        submitExam();
      }
    }, 1000);
  }

  // Scoring Math (+2 / -0.5) & Submission
  function submitExam() {
    clearInterval(timerInterval);

    let correctCount = 0;
    let wrongCount = 0;
    let unattemptedCount = 0;
    let totalScore = 0;

    questionsData.forEach((item, idx) => {
      const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
      if (selected) {
        if (selected.value === item.ans) {
          correctCount++;
          totalScore += 2;
        } else {
          wrongCount++;
          totalScore -= 0.5;
        }
      } else {
        unattemptedCount++;
      }
    });

    // Populate Results Screen
    document.getElementById('scoreVal').innerText = totalScore;
    document.getElementById('correctVal').innerText = correctCount;
    document.getElementById('wrongVal').innerText = wrongCount;
    document.getElementById('unattemptedVal').innerText = unattemptedCount;

    // Send payload to Google Sheets
    syncResultsToGoogleSheet({
      name: currentStudent.name,
      phone: currentStudent.phone,
      score: totalScore,
      correct: correctCount,
      wrong: wrongCount,
      unattempted: unattemptedCount
    });

    // Generate Green / Red Color-Coded Answer Key
    renderReview();

    document.getElementById('examSection').classList.add('hidden');
    document.getElementById('resultSection').classList.remove('hidden');
  }

  // Render Detailed Review UI
  function renderReview() {
    const container = document.getElementById('reviewContainer');
    container.innerHTML = questionsData.map((item, idx) => {
      const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
      const userSelection = selected ? selected.value : null;

      return `
        <div class="question-card">
          <div class="question-title">${idx + 1}. ${item.q}</div>
          <div class="options-list">
            ${item.options.map((opt, oIdx) => {
              const letter = String.fromCharCode(65 + oIdx);
              let styleClass = "";
              
              if (letter === item.ans) {
                styleClass = "correct-ans";
              } else if (userSelection === letter && userSelection !== item.ans) {
                styleClass = "wrong-ans";
              }

              return `<div class="option-item ${styleClass}">${opt}</div>`;
            }).join('')}
          </div>
          <div class="status-tag">
            ${userSelection === null ? '<span style="color:#64748b;">Status: Skipped</span>' :
              userSelection === item.ans ? '<span style="color:#16a34a;">Status: Correct (+2)</span>' :
              '<span style="color:#dc2626;">Status: Incorrect (-0.5)</span>'}
          </div>
        </div>
      `;
    }).join('');
  }

  // Google Sheets API Integration
  function syncResultsToGoogleSheet(payload) {
    if(!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") return;

    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).catch(err => console.error("Sheet Error:", err));
  }
</script>
